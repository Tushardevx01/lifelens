services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     lifelens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB:       lifelens_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifelens -d lifelens_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - model_data:/app/models
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://lifelens:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/lifelens_db
      REDIS_URL:    redis://redis:6379/0
      SECRET_KEY:   ${SECRET_KEY:?SECRET_KEY is required}
      FINANCIAL_WEBHOOK_SECRET: ${FINANCIAL_WEBHOOK_SECRET:?FINANCIAL_WEBHOOK_SECRET is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_MODEL: ${LLM_MODEL:-gemini-1.5-pro}
      ENVIRONMENT:  development
      FRONTEND_URL: http://localhost:8081
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=2 -E
    volumes:
      - ./backend:/app
      - model_data:/app/models
    environment:
      DATABASE_URL: postgresql+asyncpg://lifelens:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/lifelens_db
      REDIS_URL:    redis://redis:6379/0
      SECRET_KEY:   ${SECRET_KEY:?SECRET_KEY is required}
      ENVIRONMENT:  development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  beat:
    build: ./backend
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://lifelens:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/lifelens_db
      REDIS_URL:    redis://redis:6379/0
      SECRET_KEY:   ${SECRET_KEY:?SECRET_KEY is required}
      ENVIRONMENT:  development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  # One-shot seeder — runs ONCE after api is healthy, seeds demo data
  api-init:
    build: ./backend
    command: python seed_sample_data.py
    volumes:
      - ./backend:/app
      - model_data:/app/models
    environment:
      DATABASE_URL: postgresql+asyncpg://lifelens:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/lifelens_db
      REDIS_URL:    redis://redis:6379/0
      SECRET_KEY:   ${SECRET_KEY:?SECRET_KEY is required}
      ENVIRONMENT:  development
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  model_data:

